name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

env:
  # Solo un push a master se genera como producción; con cualquier otro valor scripts/build-headers.mjs añade
  # `X-Robots-Tag: noindex`. El artefacto que se verifica es el mismo que se despliega.
  CONTEXT: ${{ github.event_name == 'push' && github.ref_name == 'master' && 'production' || 'ci' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run generate
      - run: npm run audit:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: .output/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    # Solo en push a master y si pasan verify y secrets. Nunca desde develop ni desde pull_request.
    # El environment «production» permite exigir aprobación manual (Settings → Environments), sin tocar este archivo.
    needs: [verify, secrets]
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://www.mauriziorendon.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # El código del repo hace falta para que Netlify CLI empaquete la Edge Function `/geo` (netlify/edge-functions).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: El artefacto de producción no lleva noindex
        run: "! grep -qi 'X-Robots-Tag' site/_headers"
      - name: Netlify deploy (producción)
        # Los secretos solo existen en este paso.
        run: npx --yes netlify-cli@27.14.2 deploy --dir=site --no-build --prod --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Comprobar cabeceras de producción y la Edge Function /geo
        run: |
          headers=$(curl -sSI --retry 3 --retry-delay 5 https://www.mauriziorendon.com/en/)
          echo "$headers"
          fail=0
          echo "$headers" | grep -qiE '^x-robots-tag:.*noindex' && { echo "::error::Producción lleva noindex"; fail=1; }
          echo "$headers" | grep -qiE "^content-security-policy:.*script-src 'self'" || { echo "::error::Falta la CSP"; fail=1; }
          echo "$headers" | grep -qiE '^cross-origin-opener-policy: *same-origin' || { echo "::error::Falta COOP same-origin"; fail=1; }
          geo=$(curl -sS -D - --retry 3 --retry-delay 5 https://www.mauriziorendon.com/geo)
          echo "$geo"
          echo "$geo" | grep -qiE '^cache-control:.*no-store' || { echo "::error::/geo sin Cache-Control no-store"; fail=1; }
          echo "$geo" | grep -qE '"country":' || { echo "::error::/geo no devuelve {country}"; fail=1; }
          exit $fail
