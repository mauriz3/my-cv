name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Solo un push a master se genera como producción; con cualquier otro valor scripts/build-headers.mjs añade
  # `X-Robots-Tag: noindex`. El artefacto que se verifica es el mismo que se despliega.
  CONTEXT: ${{ github.event_name == 'push' && github.ref_name == 'master' && 'production' || 'ci' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests unitarios con cobertura (una sola pasada; sin umbral por ahora, solo informa).
      - run: npm run coverage
      - name: Resumen de cobertura
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: error
          retention-days: 7
      - run: npm run generate
      - run: npm run audit:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: .output/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Accesibilidad (axe, @axe-core/playwright) sobre el sitio generado en verify, servido en local.
  # Falla con violaciones serious/critical. Usa el Google Chrome del runner (sin descargar navegadores).
  a11y:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Sin scripts: `nuxt prepare` no hace falta para servir y auditar el artefacto.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .output/public
      - run: npm run test:a11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: a11y-report
          path: playwright-report
          retention-days: 7

  # Lighthouse (@lhci/cli, lighthouserc.json) sobre el mismo artefacto; informes HTML/JSON como artefacto, sin servicio externo.
  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .output/public
      # @lhci/cli va con versión fija vía npx (como netlify-cli): no entra en package-lock ni en npm ci.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    # Solo en push a master y si pasan verify, secrets, a11y y lighthouse. Nunca desde pull_request.
    # El environment «production» permite exigir aprobación manual (Settings → Environments), sin tocar este archivo.
    needs: [verify, secrets, a11y, lighthouse]
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://www.mauriziorendon.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # El código del repo hace falta para que Netlify CLI empaquete la Edge Function `/geo` (netlify/edge-functions)
      # y las funciones de Visitas (netlify/functions); estas importan lib/ y paquetes npm (zod, @netlify/blobs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Sin scripts (`nuxt prepare` no hace falta aquí): solo las dependencias que esbuild mete en las funciones.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: El artefacto de producción no lleva noindex
        run: "! grep -qi 'X-Robots-Tag' site/_headers"
      - name: Netlify deploy (producción)
        # Los secretos solo existen en este paso.
        run: npx --yes netlify-cli@27.14.2 deploy --dir=site --no-build --prod --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Comprobar cabeceras de producción, la Edge Function /geo, las rutas de Visitas y los enlaces de Libros
        run: |
          headers=$(curl -sSI --retry 3 --retry-delay 5 https://www.mauriziorendon.com/en/)
          echo "$headers"
          fail=0
          echo "$headers" | grep -qiE '^x-robots-tag:.*noindex' && { echo "::error::Producción lleva noindex"; fail=1; }
          echo "$headers" | grep -qiE "^content-security-policy:.*script-src 'self'" || { echo "::error::Falta la CSP"; fail=1; }
          echo "$headers" | grep -qiE '^cross-origin-opener-policy: *same-origin' || { echo "::error::Falta COOP same-origin"; fail=1; }
          geo=$(curl -sS -D - --retry 3 --retry-delay 5 https://www.mauriziorendon.com/geo)
          echo "$geo"
          echo "$geo" | grep -qiE '^cache-control:.*no-store' || { echo "::error::/geo sin Cache-Control no-store"; fail=1; }
          echo "$geo" | grep -qE '"country":' || { echo "::error::/geo no devuelve {country}"; fail=1; }
          post=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://www.mauriziorendon.com/geo)
          [ "$post" = 405 ] || { echo "::error::/geo acepta POST ($post)"; fail=1; }
          # Visitas: la función responde (cabecera x-visits-source: snapshot | mock) con el informe del rango pedido.
          for range in 1d 7d 30d; do
            visits=$(curl -sS -D - --retry 3 --retry-delay 5 "https://www.mauriziorendon.com/api/visits/$range")
            echo "$visits" | grep -iE '^(HTTP|x-visits-source|content-type)'
            echo "$visits" | grep -qiE '^x-visits-source: *(snapshot|mock)' || { echo "::error::/api/visits/$range no la sirve la función"; fail=1; }
            echo "$visits" | grep -qE "\"range\":\"$range\"" || { echo "::error::/api/visits/$range no devuelve su informe"; fail=1; }
          done
          # Enlaces cortos de Libros: 200 sin redirección y con vista previa para LinkedIn.
          for path in /en/books /es/libros; do
            short=$(curl -sS -A LinkedInBot -D - --retry 3 --retry-delay 5 "https://www.mauriziorendon.com$path")
            echo "$short" | grep -iE '^HTTP'
            echo "$short" | head -1 | grep -qE ' 200' || { echo "::error::$path no responde 200"; fail=1; }
            echo "$short" | grep -qE 'property="og:image"' || { echo "::error::$path sin og:image"; fail=1; }
          done
          exit $fail
