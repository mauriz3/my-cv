name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Only one push to master is generated as a production; with any other value scripts/build-headers.mjs adds
  # `X-Robots-Tag: noindex`. The artifact that is verified is the same one that is deployed.
  CONTEXT: ${{ github.event_name == 'push' && github.ref_name == 'master' && 'production' || 'ci' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests (unit and composables) with single pass coverage; fails below 80% (vitest.config.ts).
      - run: npm run coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: error
          retention-days: 7
      - run: npm run generate
      - run: npm run audit:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: .output/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Accessibility (axe, @axe-core/playwright) on the site built in verify, served locally.
  # Fails on serious/critical violations. Uses the runner's Google Chrome (no browser download).
  a11y:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No scripts: `nuxt prepare` is not needed to serve and audit the artifact.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .output/public
      - run: npm run test:a11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: a11y-report
          path: playwright-report
          retention-days: 7

  # Lighthouse (@lhci/cli, lighthouserc.cjs) on the same artifact; HTML/JSON reports as artifact, no external service.
  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # @lhci/cli is an exact devDependency pinned by package-lock: `npm ci` installs it, nothing is fetched ad hoc.
      # No scripts: `nuxt prepare` is not needed to serve and audit the artifact.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .output/public
      # Visit from outside the region with notice: all thresholds are blocking.
      - run: npm run lighthouse
      # Only the production build carries the notice of analytics: first visit from the EU (ES), informative performance.
      - run: npm run lighthouse:consent
        if: ${{ !cancelled() && env.CONTEXT == 'production' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: |
            lighthouse-report
            lighthouse-report-consent
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Independent startup smoke test: no registry push, credentials, or production changes.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: my-cv:local
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
      - name: Scan runtime image (fixable HIGH/CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          image-ref: my-cv:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 5m
          cache: true
      - name: Start unprivileged container and verify routes, headers and sample Visits
        run: |
          # Synthetic sentinels prove a general .env cannot inject external-service settings.
          printf '%s\n' GA_PROPERTY_ID=not-forwarded GA_SERVICE_ACCOUNT_JSON=not-forwarded NETLIFY_AUTH_TOKEN=not-forwarded NETLIFY_SITE_ID=not-forwarded VISITS_SNAPSHOT_FILE=not-forwarded > .env
          docker compose up --no-build --wait --wait-timeout 90
          id=$(docker compose ps -q web)
          test "$(docker inspect --format '{{.State.Health.Status}}' "$id")" = healthy
          docker inspect "$id" | python3 -c 'import json,sys; c=json.load(sys.stdin)[0]; p=c["HostConfig"]["PortBindings"]["8080/tcp"]; assert p == [{"HostIp":"127.0.0.1","HostPort":"8080"}]; h=c["HostConfig"]; assert h["Memory"] == 268435456 and h["NanoCpus"] == 1000000000 and h["PidsLimit"] == 64 and h["ReadonlyRootfs"]; assert c["Config"]["User"] == "10001:10001"; assert not any(e.startswith(("GA_", "NETLIFY_", "VISITS_SNAPSHOT_FILE=")) for e in c["Config"]["Env"])'
          test "$(docker compose port web 8080)" = 127.0.0.1:8080
          test "$(docker compose exec -T web id -u)" = 10001
          docker compose exec -T web node --input-type=module -e 'import { lstatSync, readdirSync } from "node:fs"; const check=p=>{const s=lstatSync(p); if(s.uid!==0||s.gid!==0||(s.mode&0o222))throw Error("Writable or non-root-owned content"); if(s.isDirectory())for(const f of readdirSync(p))check(p+"/"+f)}; check("/app")'
          docker compose exec -T web sh -c 'test ! -d node_modules && test ! -e .env && ! command -v npm'
          for path in /en/ /es/ /en/books /es/libros /en/visits /es/visits; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:8080$path")" = 200
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/not-found)" = 404
          curl -fsSI http://localhost:8080/en/ > /tmp/docker-headers
          grep -qi '^content-security-policy:.*sha256-' /tmp/docker-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/docker-headers
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/docker-headers
          grep -qi '^x-robots-tag: noindex' /tmp/docker-headers
          test "$(curl -sS -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: es' http://localhost:8080/)" = http://localhost:8080/es/
          test "$(curl -sS -o /dev/null -w '%{redirect_url}' http://localhost:8080/)" = http://localhost:8080/en/
          for range in 1d 7d 30d; do
            curl -fsS "http://localhost:8080/api/visits/$range" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["sample"] is True'
          done
          curl -fsS http://localhost:8080/geo | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"country": None}'
          docker stats --no-stream --format 'Runtime usage: {{.MemUsage}} memory, {{.CPUPerc}} CPU, {{.PIDs}} PIDs' "$id" | tee -a "$GITHUB_STEP_SUMMARY"
          docker image inspect my-cv:local --format 'Docker image: {{.Size}} bytes (uncompressed)' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down

  deploy-production:
    # Only on push to master after verify, secrets, a11y, and lighthouse pass. Never from pull_request.
    # The production environment allows you to require manual approval (Settings → Environments), without touching this file.
    needs: [verify, secrets, a11y, lighthouse]
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://www.mauriziorendon.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Repo code required for Netlify CLI to package Edge Function `/geo` (netlify/edge-functions)
      # and Visits functions (netlify/functions); these import lib/ and npm packages (zod, @netlify/blobs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No scripts (`nuxt prepare` is not needed here): the dependencies esbuild puts in the functions and netlify-cli.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: The production artifact does not carry noindex
        run: "! grep -qi 'X-Robots-Tag' site/_headers"
      - name: Netlify deploy (production)
        # Secrets exist only in this step. netlify-cli is an exact devDependency pinned by package-lock (installed
        # by `npm ci` above); `--no-install` fails instead of downloading an unpinned copy.
        run: npx --no-install netlify deploy --dir=site --no-build --prod --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Check Production Headers, Edge Function /Geo, Visitor Routes and Book Links
        run: |
          headers=$(curl -sSI --retry 3 --retry-delay 5 https://www.mauriziorendon.com/en/)
          echo "$headers"
          fail=0
          echo "$headers" | grep -qiE '^x-robots-tag:.*noindex' && { echo "::error::Production leads noindex"; fail=1; }
          echo "$headers" | grep -qiE "^content-security-policy:.*script-src 'self'" || { echo "::error::Missing CSP"; fail=1; }
          echo "$headers" | grep -qiE '^cross-origin-opener-policy: *same-origin' || { echo "::error::Missing COOP same-origin"; fail=1; }
          geo=$(curl -sS -D - --retry 3 --retry-delay 5 https://www.mauriziorendon.com/geo)
          echo "$geo"
          echo "$geo" | grep -qiE '^cache-control:.*no-store' || { echo "::error::/geo missing Cache-Control no-store"; fail=1; }
          echo "$geo" | grep -qE '"country":' || { echo "::error::/geo does not return {country}"; fail=1; }
          post=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://www.mauriziorendon.com/geo)
          [ "$post" = 405 ] || { echo "::error::/geo accepts POST ($post)"; fail=1; }
          # Visits: the function responds (x-visits-source header: snapshot | mock) with the requested range report.
          for range in 1d 7d 30d; do
            visits=$(curl -sS -D - --retry 3 --retry-delay 5 "https://www.mauriziorendon.com/api/visits/$range")
            echo "$visits" | grep -iE '^(HTTP|x-visits-source|content-type)'
            echo "$visits" | grep -qiE '^x-visits-source: *(snapshot|mock)' || { echo "::error::/api/visits/$range is not served by the "; fail=1; }
            echo "$visits" | grep -qE "\"range\":\"$range\"" || { echo "::error::/api/visits/$range does not return its report"; fail=1; }
          done
          # Short Book Links: 200 without redirection and previewed for LinkedIn.
          for path in /en/books /es/libros; do
            short=$(curl -sS -A LinkedInBot -D - --retry 3 --retry-delay 5 "https://www.mauriziorendon.com$path")
            echo "$short" | grep -iE '^HTTP'
            echo "$short" | head -1 | grep -qE ' 200' || { echo "::error::$path does not return 200"; fail=1; }
            echo "$short" | grep -qE 'property="og:image"' || { echo "::error::$path missing og:image"; fail=1; }
          done
          exit $fail
