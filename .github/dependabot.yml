# Weekly reviewed updates; no auto-merge. Minor/patch updates are grouped per ecosystem.
# No target-branch: PRs use the default branch (master).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: 'chore(deps)', prefix-development: 'chore(deps)' }
    groups:
      # @vitest/coverage-v8 pins an exact vitest peer, so majors must land together.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The site uses Node 24; keep matching Node types.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    commit-message: { prefix: 'chore(deps)' }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    commit-message: { prefix: 'chore(deps)' }
