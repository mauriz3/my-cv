# Actualizaciones semanales de dependencias. Sin auto-merge: cada PR pasa la CI (verify + secrets) y se revisa a mano.
# Minor y patch van agrupadas en una sola PR por ecosistema; las major llegan sueltas.
# Sin target-branch: las PRs van a la rama por defecto del repo (master).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: 'chore(deps)', prefix-development: 'chore(deps)' }
    groups:
      # @vitest/coverage-v8 pins an exact vitest peer, so majors must land together.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # La web corre en Node 24: los tipos deben seguir esa major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    commit-message: { prefix: 'chore(deps)' }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
