# Este archivo manda sobre la configuración de la UI de Netlify (comando de build y carpeta publicada).
[build]
  command = "npm run test && npm run generate"
  publish = ".output/public"
  # Edge Function `/geo` (país de la visita para el aviso de analítica; la ruta va en su `config` inline).
  # `netlify deploy --no-build` la empaqueta desde aquí: el job deploy-production hace checkout del repo.
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "24" # mismo valor que .nvmrc

# Funciones de Visitas (datos de GA4): `visits` sirve /api/visits/:range y `visits-snapshot` (programada, cada 3 h)
# guarda la instantánea en Netlify Blobs. Rutas y horario van en el `config` de cada función.
# Variables (solo en Netlify, ámbito Functions): GA_PROPERTY_ID y GA_SERVICE_ACCOUNT_JSON.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# El `noindex` fuera de producción lo añade scripts/build-headers.mjs en `_headers`.
