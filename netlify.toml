# Netlify settings that override the UI. Production deploys come only from GitHub Actions
# (`netlify deploy --no-build` in .github/workflows/ci.yml, after verify, secrets, a11y and Lighthouse).
[build]
  # No Netlify-side build: `ignore` exiting 0 skips any build Netlify would start from Git (auto-builds,
  # deploy previews), so nothing bypasses CI even if continuous deployment is switched on by mistake.
  ignore = "exit 0"
  publish = ".output/public"
  # Edge Function `/geo` (visitor country for the analytics notice; its path lives in its inline `config`).
  # `netlify deploy --no-build` bundles it from here: the deploy-production job checks out the repo.
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "24" # same as .nvmrc

# Visits functions (GA4 data): `visits` serves /api/visits/:range and `visits-snapshot` (scheduled, every 3 h)
# stores the snapshot in Netlify Blobs. Paths, schedule and rate limits live in each function's `config`.
# Variables (Netlify only, Functions scope): GA_PROPERTY_ID and GA_SERVICE_ACCOUNT_JSON.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Non-production `noindex` is added to `_headers` by scripts/build-headers.mjs.
